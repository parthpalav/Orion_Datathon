name: Collect traffic samples

# Samples TomTom flow at every point in ml/corridors.json and stores it in Mongo.
# Needs repository secrets TOMTOM_API_KEY and MONGO_URI.
# GitHub pauses scheduled workflows after 60 days without repository activity, and may start runs late at busy times.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: pip install -r ml/requirements.txt
      - run: python ml/collect.py
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
