services:
  - type: web
    name: orionmaps-api
    runtime: node
    region: oregon
    plan: free
    branch: main
    rootDir: server
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: CORS_ORIGINS
        value: https://orion-81736.web.app,https://orion-81736.firebaseapp.com,https://orionmaps.xyz,https://www.orionmaps.xyz
      # Secrets: set these in the Render dashboard
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: MAPBOX_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: TOMTOM_API_KEY
        sync: false
      # Legacy, removed once chat and news move to Gemini (P5/P6)
      - key: FEATHERLESS_API_KEY
        sync: false
